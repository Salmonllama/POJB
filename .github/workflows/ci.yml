name: Java 21 CI for Test Suite

on:
    push:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '21'
            - run: java tools/Build.java jar
            - run: java -jar out/libs/modbot.jar --version
            - run: java tools/Build.java test
